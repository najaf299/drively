name: drivly
description: Drivly - Peer-to-Peer Car Rental Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.2.0
  dio: ^5.4.0
  flutter_secure_storage: ^9.2.2
  cached_network_image: ^3.3.1
  image_picker: ^1.0.7
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  intl: ^0.19.0
  flutter_stripe: ^10.1.1
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.15
  firebase_analytics: ^10.8.9
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  shimmer: ^3.0.0
  flutter_rating_bar: ^4.0.1
  photo_view: ^0.15.0
  url_launcher: ^6.2.5
  share_plus: ^9.0.0
  connectivity_plus: ^6.0.3
  freezed_annotation: ^2.4.1
  json_annotation: ^4.8.1
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  flutter_local_notifications: ^17.0.0
  web_socket_channel: ^2.4.4
  lottie: ^3.1.0
  fl_chart: ^0.68.0
  table_calendar: ^3.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.8
  freezed: ^2.4.7
  json_serializable: ^6.7.1
  riverpod_generator: ^2.4.0
  mockito: ^5.4.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/animations/
  # NOTE: custom fonts (Space Grotesk / Inter per the design spec) can be added
  # here once the .ttf files are placed in assets/fonts/. The app currently uses
  # the platform default font with the design-system type scale (see theme.dart).
