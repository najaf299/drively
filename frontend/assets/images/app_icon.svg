<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- Solid dark background. iOS clips to the rounded mask, so a full square is required -->
  <rect width="1024" height="1024" fill="#0B0D14"/>

  <!-- Soft radial lime glow behind the mark -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#CBF24A" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#CBF24A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#CBF24A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="1024" fill="url(#glow)"/>

  <!-- Car icon, lime stroke, centered. Mirrors backend/public/favicon.svg shapes scaled to 1024. -->
  <g transform="translate(192,256) scale(26.6667)"
     fill="none" stroke="#CBF24A" stroke-width="2"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2"/>
    <circle cx="7" cy="17" r="2"/>
    <path d="M9 17h6"/>
    <circle cx="17" cy="17" r="2"/>
  </g>
</svg>
